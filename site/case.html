.gal-nav{display:flex;align-items:center;gap:12px;margin-top:14px}.gal-nav button{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid rgba(224,119,79,.3);cursor:pointer;font-size:16px;transition:background .3s,color .3s}.gal-nav button:hover{background:var(--tone);color:#fff}

/* page map */
.md.pmap{--mh:540px;padding:28px 30px 26px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,250,243,.6));border:1px solid #fff;box-shadow:0 40px 80px -60px rgba(120,60,30,.5)}
